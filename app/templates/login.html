<!DOCTYPE html>
{% load static %}
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Roamly — Login</title>
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/bootstrap/5.3.3/css/bootstrap.min.css" />
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.0/css/all.min.css" />
  <link rel="stylesheet" href="{% static "css/login.css" %}">
</head>
<body>

<div class="auth-wrapper">

  <div class="auth-image d-none d-md-flex">
    <span class="brand">Roamly</span>
    <h2>Welcome back,<br>explorer.</h2>
    <p>Log in to pick up where your last adventure left off.</p>
  </div>

  <div class="auth-form">

    <a href="index.html" class="fw-bold fs-3 text-dark d-md-none mb-4">Roamly</a>

    <h4 class="fw-bold mb-1">Sign in to your account</h4>
    <p class="text-muted small mb-4">Don't have an account? <a href="signup.html" class="text-primary fw-semibold">Sign up</a></p>

    <div class="mb-3">
      <label class="form-label" for="email">Email address</label>
      <div class="input-group">
        <span class="input-group-text"><i class="fa-regular fa-envelope"></i></span>
        <input type="email" id="email" class="form-control" placeholder="you@example.com" />
      </div>
    </div>

    <div class="mb-2">
      <label class="form-label" for="password">Password</label>
      <div class="input-group">
        <span class="input-group-text"><i class="fa-solid fa-lock"></i></span>
        <input type="password" id="password" class="form-control" placeholder="••••••••" />
      </div>
    </div>

    <div class="d-flex justify-content-between align-items-center mb-4">
      <div class="form-check">
        <input class="form-check-input" type="checkbox" id="remember" />
        <label class="form-check-label small" for="remember">Remember me</label>
      </div>
      <a href="#" class="text-primary small">Forgot password?</a>
    </div>

    <button class="btn btn-primary w-100 mb-3">Log In</button>

    <div class="divider">or continue with</div>

    <div class="d-flex gap-3">
      <button class="btn-social flex-fill d-flex align-items-center justify-content-center gap-2">
        <i class="fa-brands fa-google text-danger"></i> Google
      </button>
      <button class="btn-social flex-fill d-flex align-items-center justify-content-center gap-2">
        <i class="fa-brands fa-facebook text-primary"></i> Facebook
      </button>
    </div>

  </div>
</div>

<script src="https://cdnjs.cloudflare.com/ajax/libs/bootstrap/5.3.3/js/bootstrap.bundle.min.js"></script>
</body>
</html>
